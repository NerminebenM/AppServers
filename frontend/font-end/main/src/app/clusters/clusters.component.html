<!-- clusters.component.html -->
<div class="cluster-container">
  <mat-toolbar color="primary">
    <span>Clusters Management</span>
    <span class="spacer"></span>
    <button *ngIf="userRole === 'admin'" mat-raised-button color="accent" (click)="openCreateClusterDialog()">Create New Cluster</button>
  </mat-toolbar>

  <div class="clusters-list">
    <mat-card *ngFor="let cluster of clusters" class="cluster-card">
      <mat-card-header class="cluster-card-header">
        <img src="assets/cluster-icon.png" alt="Cluster Icon" class="cluster-icon">
        <div>
          <div class="cluster-card-title">{{ cluster.name }}</div>
          <div class="cluster-card-subtitle">{{ cluster.description }}</div>
        </div>
      </mat-card-header>
      <mat-card-content>
        <button mat-button (click)="openMaintenanceSettingsDialog(cluster)">
          <mat-icon>settings</mat-icon>
          Maintenance Settings
        </button>
      </mat-card-content>
      <mat-card-actions>
        <button *ngIf="userRole === 'admin'" mat-raised-button class="button-edit" (click)="openEditClusterDialog(cluster)">
          <mat-icon>edit</mat-icon>
          Edit
        </button>
        <button *ngIf="userRole === 'admin'" mat-raised-button class="button-delete" (click)="deleteCluster(cluster.id)">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
