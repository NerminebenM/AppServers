<div class="login-container">
  <div class="login-wrapper">
    <mat-card class="login-card">
      <mat-card-content>
        <div class="text-center mb-4">
          <img src="assets/images/logos/progress.png" alt="Company Logo" class="company-logo">
        </div>
        <div class="text-center">
          <h2>Welcome Back</h2>
          <p>Please sign in to your account</p>
        </div>
        <form (ngSubmit)="onSubmit()" class="login-form">
          <div class="form-group">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Username</mat-label>
              <input matInput type="text" name="username" [(ngModel)]="form.username" required autocomplete="username">
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Password</mat-label>
              <input matInput type="password" name="password" [(ngModel)]="form.password" required autocomplete="current-password">
            </mat-form-field>
          </div>
          <button type="submit" mat-flat-button color="primary" class="w-100">Sign In</button>
          <div *ngIf="isLoginFailed" class="text-danger mt-3">
            {{ errorMessage }}
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
